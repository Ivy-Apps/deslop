id: broken
name: Broken Rulebook
description: >-
  Every rule here is broken, and in a different way. Deslop must refuse to run
  and report all of them at once: fixing a rulebook one error per run is the
  behaviour this fixture exists to prevent coming back.
rules:
  - id: provider-components-are-isolated
    description: A provider's components must not import another provider's code
    target: "@/components/{{provider}}/**"
    forbids:
      - import: "@/components/**"
    fix: Import only from within your own provider folder.

  - id: provider-view-is-unanchored
    description: >-
      {{provider-name}} has ** on both sides, so nothing in the pattern says
      which directory it names.
    target: "@/**/{{provider-name}}/**/{{FileName}}View"
    uses:
      - import: "@/config/{{provider-name}}"
    fix: Anchor the provider variable against a literal.

  - id: view-has-no-boundary
    description: >-
      A * between two variables is not a boundary, because it can match
      nothing at all.
    target: "@/x/{{FileName}}*{{ServiceType}}"
    forbids:
      - import: "@/internal/**"
    fix: Separate the two variables with a literal.

  - id: target-goes-back-a-directory
    description: >-
      A target is matched against whole module ids, so there is no directory
      for .. to be relative to.
    target: "@/client/../shared/**"
    forbids:
      - import: "@/internal/**"
    fix: Write @/shared/** rather than going back a directory.

  - id: exclude-goes-back-a-directory
    description: >-
      An exclude is matched against whole module ids too. Its target compiles,
      which is what makes this error the exclude's own - an exclude is checked
      whether or not the rule's target survived.
    target: "@/client/{{file-name}}"
    exclude:
      - "@/client/../shared/**"
    forbids:
      - import: "@/internal/**"
    fix: Write @/shared/** rather than going back a directory.
