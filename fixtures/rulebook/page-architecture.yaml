id: page-arch
name: Page Architecture
description: Architectural rules to build web pages
rules:
  - id: next-js-page-on-server
    description: >-
      Add a page in /src/app/[locale]/{route} to connect it with the NextJS router. 
      It should be executed on the server. 
      Use the page to SSR data and pass it as a parameter to the Container that will display the UI.
    target: "@/app/**/page"
    example: |
      import { HomeContainer } from "@/features/home/HomeContainer";

      export default async function HomePage() {
        const user = await fetchUserSSR();
        return <HomeContainer initialData={user} />
      }
    fix: >-
      Make sure that there is no 'use client' and no client-side code is executed in the page TS module.
      If you need a client side code (React state / hooks) move it to a @/features/**/*Container.

  - id: page-container
    description: Each page should have a Container that's executed on the client. It connects the View (pure UI) and its viewmodel hook.
    target: "@/app/**/page"
    uses:
      - import: "@/features/**/*Container"
    fix: Extract the client-side logic in a Container and put it in @/features/{feature-name}/{Feature}Container.

  - id: page-container-wires-view-and-viewmodel
    description: >-
      A Container is a glue code executed on the client side that connects a View with its ViewModel hook.
      The Container optionally accepts initial SSR data from the page and passes it to the ViewModel.
    target: "@/features/**/{{FileName}}Container"
    uses:
      - import: "{{TARGET_DIR}}/{{FileName}}StateEvent"
      - import: "{{TARGET_DIR}}/use{{FileName}}ViewModel"
      - import: "{{TARGET_DIR}}/{{FileName}}View"
        transitive: true
    example: |
      "use client"

      import { HomeUiState, HomeUiEvent } from "@/features/home/HomeStateEvent"
      import { HomeView } from "@/features/home/HomeView";
      import { useHomeViewModel } from "@/features/home/useHomeViewModel"

      // Optional pre-loaded data passed from the page
      export interface Props {
        user: User | null;
      }

      export function HomeContainer({ user }: Props) {
        const { state, onEvent } = useHomeViewModel({ user });
        return <HomeView state={state} onEvent={onEvent} />;
      }
    fix: >-
      Add a "use client" directive at the top of the file.
      Make sure that you're using the feature's View and ViewModel from the same directory.
      The purpose of the Container is to wire the View and the ViewModel together.

  - id: viewmodel
    description: >-
      The ViewModel is a custom React hook that encapsulates the View's state and business logic.
      It must be strictly free of UI elements (JSX) and must not perform direct HTTP fetch calls.
      Instead, it should manage the state and delegate data fetching to the data layer (repositories).
    target: "@/features/**/use{{FileName}}ViewModel"
    uses:
      - import: "{{TARGET_DIR}}/{{FileName}}StateEvent"
    uses-optional:
      - "{{TARGET_DIR}}/data/{{FileName}}-repository"
      - "@/data/**/*-repository"
      - "{{TARGET_DIR}}/domain/**/*"
      - "@/domain/**/*"
    forbids:
      - import: "{{TARGET_DIR}}/{{FileName}}View"
      - import: "@/**/components/**/*"
    example: |
      import { useState } from "react";
      import { HomeUiState, HomeUiEvent } from "@/features/home/HomeStateEvent";
      import { logoutUser } from "@/features/home/data/Home-repository";

      export interface Props {
        user: User | null;
      }

      export function useHomeViewModel(props: Props) {
        const [state, setState] = useState<HomeUiState>({ 
          user: props.user,
          isLoading: false 
        });

        const onEvent = async (event: HomeUiEvent) => {
          switch (event.type) {
            case "LOGOUT_CLICKED":
              setState(prev => ({ ...prev, isLoading: true }));
              // Delegate to the repository instead of using fetch()
              await logoutUser();
              setState({ user: null, isLoading: false });
              break;
          }
        };

        return { state, onEvent };
      }
    fix: >-
      Extract any UI (JSX) into the View component. Remove direct `fetch` calls and replace them
      with function calls imported from a `-repository` file. Ensure the hook returns the current 
      `state` and an `onEvent` dispatcher. Do not import any Views or UI components from any directory.

  - id: viewmodel-test
    description: >-
      Each ViewModel must have a corresponding unit test file to verify its state transitions, 
      event handling, and business logic independently of the UI components.
    target: "@/features/**/use{{FileName}}ViewModel"
    exists:
      - module: "{{TARGET_DIR}}/use{{FileName}}ViewModel.spec"
    uses:
      - import: "{{TARGET_DIR}}/use{{FileName}}ViewModel"
    example: |
      import { renderHook, act } from "@testing-library/react";
      import { useHomeViewModel } from "@/features/home/useHomeViewModel";
      import * as repository from "@/features/home/data/Home-repository";

      // Mock the repository to isolate the ViewModel logic
      vi.mock("@/features/home/data/Home-repository");

      describe("useHomeViewModel", () => {
        it("handles LOGOUT_CLICKED event properly", async () => {
          const { result } = renderHook(() => useHomeViewModel({ user: { name: "Alice" } }));
          
          await act(async () => {
            await result.current.onEvent({ type: "LOGOUT_CLICKED" });
          });

          expect(repository.logoutUser).toHaveBeenCalled();
          expect(result.current.state.user).toBeNull();
        });
      });
    fix: >-
      Create a unit test file named `use{{FileName}}ViewModel.spec.ts` in the same directory.
      Ensure you import the ViewModel hook from `{{TARGET_DIR}}/use{{FileName}}ViewModel` and test its state and event dispatcher.

  - id: page-view
    description: >-
      Each page/feature should have a pure UI (View) that renders the UiState 
      and submits user interactions as UiEvents.
    target: "@/features/**/{{FileName}}View"
    uses:
      - import: "{{TARGET_DIR}}/{{FileName}}StateEvent"
    uses-optional:
      - "{{TARGET_DIR}}/components/*"
      - "@/components/**/*"
    example: |
      import { HomeUiState, HomeUiEvent } from "@/features/home/HomeStateEvent";
      import { Button } from "@/components/ui/Button";
      import { UserAvatar } from "@/features/home/components/UserAvatar";

      export interface Props {
        state: HomeUiState;
        onEvent: (event: HomeUiEvent) => void;
      }

      export function HomeView({ state, onEvent }: Props) {
        return (
          <div>
            <UserAvatar user={state.user} />
            <h1>Hello, {state.user?.name || "Guest"}</h1>
            <Button onClick={() => onEvent({ type: "LOGOUT_CLICKED" })}>
              Logout
            </Button>
          </div>
        );
      }
    fix: >-
      Ensure the View is a pure UI component that only receives `state` and an `onEvent` callback.
      It should not contain data fetching, complex business logic, or its own state hooks.
      Use local or global shared components for the UI blocks.

  - id: page-view-storybook
    description: >-
      Each pure UI View should have a corresponding Storybook file to develop, test, 
      and document its various UI states in isolation.
    target: "@/features/**/{{FileName}}View"
    exists:
      - module: "{{TARGET_DIR}}/{{FileName}}View.stories"
    example: |
      import type { Meta, StoryObj } from "@storybook/react";
      import { HomeView } from "@/features/home/HomeView";

      const meta: Meta<typeof HomeView> = {
        component: HomeView,
        title: "Features/Home/HomeView",
      };

      export default meta;
      type Story = StoryObj<typeof HomeView>;

      const noop = () => {};

      export const Default: Story = {
        args: {
          state: { user: { name: "Alice" } },
          onEvent: noop,
        },
      };

      export const Guest: Story = {
        args: {
          state: { user: null },
          onEvent: noop,
        },
      };
    fix: >-
      Create a Storybook file named `{{FileName}}View.stories.tsx` in the same directory as the View.
      Ensure you mock the necessary `state` to showcase various UI states and provide a no-op for the `onEvent` prop.

  - id: features-cant-import-other-features
    description: Features can't import from other features.
    target: "@/features/**"
    forbids:
      - import: "@/features/**" # forbid all features imports
    allows:
      - import: "{{TARGET_DIR}}/**" # except when imports from the target dir
    fix: Use only what's internally in the feature folder or promote the used code to a shared place.
