id: layers
name: Layers
description: Spike rules probing how Haskell module names meet Glob+ patterns
rules:
  - id: no-text-slashed
    description: Tiny must not use Data.Text, spelled with slashes as ADR 19 says names are.
    target: "Tiny/**"
    forbids:
      - import: "Data/Text"
    fix: Remove it.
  - id: no-text-dotted
    description: Tiny must not use Data.Text, spelled with dots as the source typed it.
    target: "Tiny/**"
    forbids:
      - import: "Data.Text"
    fix: Remove it.
  - id: main-not-d
    description: Main must not import Tiny/D directly.
    target: "Main"
    forbids:
      - import: "Tiny/D"
    fix: Go through Tiny/A.
  - id: mains-not-a
    description: No executable may import Tiny/A.
    target: "Main"
    forbids:
      - import: "Tiny/A"
    fix: Go through Tiny/B.
