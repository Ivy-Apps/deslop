id: layers
name: Layers
description: >-
  Haskell Module Names are qualified by the cabal component that compiles them
  (lib/hs-tiny/Tiny/A, exe/hs-tiny-tool/Main) and also answer to the bare GHC
  name (Tiny/A, Main), so rules can speak about either.
rules:
  - id: no-text
    description: The library must not use Data.Text; external names are slash-segmented too.
    target: "Tiny/**"
    forbids:
      - import: "Data/Text"
    fix: Remove it.
  - id: exes-not-a
    description: Executable {{exe-name}} must not import Tiny/A.
    target: "exe/{{exe-name}}/**"
    forbids:
      - import: "Tiny/A"
    fix: Go through Tiny/B.
  - id: lib-not-exe
    description: The library must not import any executable's modules.
    target: "lib/**"
    forbids:
      - import: "exe/**"
    fix: Move the shared code into the library.
  - id: tool-no-text
    description: >-
      The tool must not use Data.Text, even through a module it shares with
      another executable.
    target: "exe/hs-tiny-tool/**"
    forbids:
      - import: "Data/Text"
    fix: Use String in the tool.
