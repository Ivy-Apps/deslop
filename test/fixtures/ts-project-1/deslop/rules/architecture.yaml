id: architecture
name: Architecture Rules
description: Architectural constraints enforcing clean separation of concerns across layers
rules:
  - id: no-tests-import-in-features
    description: >-
      Feature modules must not import from the test fixtures directory (@tests).
      Test helpers are meant only for test files, not for production code.
    target: "@/features/**/*"
    forbids:
      - import: "@tests/*"
    fix: >-
      Remove the import from the tests directory.
      If you need shared data structures, move them to @/lib or @/features instead.

  - id: no-react-in-lib
    description: >-
      Library modules in @/lib must not directly import React.
      The lib layer should contain pure, framework-agnostic utilities.
    target: "@/lib/**/*"
    forbids:
      - import: "react"
    fix: >-
      Remove the direct React import from this library module.
      Extract any React-specific code into a component under @/components or @/features.

  - id: viewmodel-has-spec
    description: >-
      Every ViewModel hook must have a corresponding spec file in the same directory
      to verify its state transitions and business logic.
    target: "@/features/**/use{{FileName}}ViewModel"
    exists:
      - "{{TARGET_DIR}}/use{{FileName}}ViewModel.spec"
    fix: >-
      Create a spec file named 'use{{FileName}}ViewModel.spec.ts' in the same directory as the ViewModel.

  - id: container-uses-state-event
    description: >-
      Every Container must import its corresponding StateEvent module from the same directory.
      The StateEvent defines the UiState and UiEvent types that wire the Container to the ViewModel and View.
    target: "@/features/**/{{FileName}}Container"
    uses:
      - "{{TARGET_DIR}}/{{FileName}}StateEvent"
    fix: >-
      Import the StateEvent module: import { ... } from '{{TARGET_DIR}}/{{FileName}}StateEvent'.

  - id: no-react-transitively-in-data
    description: >-
      Data layer modules in @/features/**/data must not transitively depend on React.
      Repositories and data access code must stay framework-agnostic so they can be
      reused in server-side and non-React contexts without pulling in the entire
      React runtime.
    target: "@/features/**/data/**"
    forbids:
      - import: "react"
        transitive: true
    fix: >-
      Remove any imports that transitively pull in React. Data layer modules must only
      import from @/lib, external non-React packages, or other framework-agnostic modules.
      Move any React-dependent logic to a ViewModel or Container in the features layer.
