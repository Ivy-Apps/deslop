name: Invalid Rulebook
rules:
  # P0
  - id: no-react-in-core
    description: "The core must not have React dependencies"
    target:
    exclude:
      - "@/**/*.e2e.spec.ts"
    forbidden:
      - import: react
        transitive: true # will check that its dependencies and their dependencies don't import React
      - import: "@/client/components/**/*"

  - id: no-test-code-in-impl
    exclude:
      - "**/*.spec.ts"
    forbidden:
      - import: "@test/**/*"
        transitive: true
