# zizmor's default lets `actions/*` stay on a tag. Every action here is pinned to
# a commit, so hold them all to it.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # release.yml runs on tags, so its caches restore only from that tag and main,
  # which no pull request can write.
  cache-poisoning:
    ignore:
      - release.yml
