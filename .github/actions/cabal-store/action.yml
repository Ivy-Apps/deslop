name: Cabal store
description: >-
  Realises the `ci` dev shell, fetches the Hackage index that `cabal.project`'s
  pinned index-state requires, and restores the cabal store: the Hackage
  packages the Nix shell does not provide, compiled once and reused until the
  toolchain or a dependency pin changes.

inputs:
  name:
    description: >-
      The store's cache namespace. Jobs whose dependencies differ need their
      own, or each would overwrite the other's store.
    required: true

runs:
  using: composite
  steps:
    # Every later step reuses the shell and the index, so this is where the
    # one-off setup cost is visible. It also asks cabal where its store is
    # rather than assuming: on the runner it is the XDG
    # ~/.local/state/cabal/store, but only because ~/.cabal is absent.
    - id: toolchain
      shell: bash
      run: |
        nix develop .#ci --accept-flake-config -c cabal update
        echo "store-dir=$(nix develop .#ci --accept-flake-config -c cabal path --store-dir)" >> "$GITHUB_OUTPUT"

    # A miss restores the newest store for this runner, so a pin bump rebuilds
    # only what it changed. The Hackage index is not cached: at over 1GB it
    # restores no faster than `cabal update` downloads it.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.toolchain.outputs.store-dir }}
        key: cabal-store-${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze', 'deslop.cabal') }}
        restore-keys: cabal-store-${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}-
