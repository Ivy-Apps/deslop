name: Release to NPM

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Binaries
    strategy:
      matrix:
        include:
          - os: macos-latest
            npm-platform: darwin-arm64
          - os: macos-13
            npm-platform: darwin-x64
          - os: ubuntu-latest
            npm-platform: linux-x64
          - os: ubuntu-24.04-arm
            npm-platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Build Binary
        run: |
          nix build --no-warn-dirty
          mkdir -p dist
          cp result/bin/deslop dist/deslop-${{ matrix.npm-platform }}
          strip dist/deslop-${{ matrix.npm-platform }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.npm-platform }}
          path: dist/deslop-${{ matrix.npm-platform }}

  publish-npm:
    name: Publish to NPM
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@ivy-apps'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare version
        run: |
          TAG=${{ github.ref_name }}
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "@ivy-apps:registry=https://registry.npmjs.org/" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for PLATFORM in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            PKG_DIR="npm/packages/$PLATFORM"
            mkdir -p "$PKG_DIR/bin"
            cp "dist/deslop-$PLATFORM" "$PKG_DIR/bin/deslop"
            chmod +x "$PKG_DIR/bin/deslop"
            cd "$PKG_DIR"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            npm publish --access public
            cd "$GITHUB_WORKSPACE"
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          npm version "$VERSION" --no-git-tag-version --allow-same-version

          # Pin optionalDependencies to the exact release version
          npm pkg set optionalDependencies.@ivy-apps/deslop-darwin-arm64="$VERSION"
          npm pkg set optionalDependencies.@ivy-apps/deslop-darwin-x64="$VERSION"
          npm pkg set optionalDependencies.@ivy-apps/deslop-linux-arm64="$VERSION"
          npm pkg set optionalDependencies.@ivy-apps/deslop-linux-x64="$VERSION"

          npm publish --access public
