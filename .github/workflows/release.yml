name: Release to NPM

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Binaries
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            ext: ''
          - os: ubuntu-latest
            target: linux-x64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell
        uses: ./.github/actions/setup-haskell

      - name: Build Binary
        shell: bash
        run: |
          cabal build all --enable-tests
          mkdir -p dist

          BIN_PATH=$(cabal list-bin deslop)

          cp "$BIN_PATH" dist/deslop-${{ matrix.target }}${{ matrix.ext }}

          # Strip symbols to reduce binary size (macOS and Linux only)
          if [ "${{ runner.os }}" != "Windows" ]; then
            strip dist/deslop-${{ matrix.target }}${{ matrix.ext }}
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/deslop-${{ matrix.target }}${{ matrix.ext }}

  publish-npm:
    name: Publish to Public NPM
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@ivy-apps'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: npm/bin
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x npm/bin/*

      - name: Prepare Package Version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}

          cd npm
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Verify package contents
        run: |
          cd npm
          npm pack --dry-run

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          npm publish --access public --provenance
