name: Release to NPM

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Binaries
    strategy:
      matrix:
        include:
          - os: macos-latest
            npm-platform: darwin-arm64
          - os: ubuntu-latest
            npm-platform: linux-x64
          - os: ubuntu-24.04-arm
            npm-platform: linux-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build Binary
        run: |
          nix build --accept-flake-config
          mkdir -p dist/${{ matrix.npm-platform }}
          cp -r result/bin/. dist/${{ matrix.npm-platform }}/

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.npm-platform }}
          path: dist/${{ matrix.npm-platform }}

  publish-npm:
    name: Publish to NPM
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@ivy-apps'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare version
        run: |
          TAG=${{ github.ref_name }}
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Publish platform packages
        run: |
          for PLATFORM in darwin-arm64 linux-arm64 linux-x64; do
            PKG_DIR="npm/packages/$PLATFORM"
            mkdir -p "$PKG_DIR/bin"
            cp -r "dist/bin-$PLATFORM/." "$PKG_DIR/bin/"
            chmod +x "$PKG_DIR/bin/deslop"
            cd "$PKG_DIR"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            npm publish --access public
            cd "$GITHUB_WORKSPACE"
          done

      - name: Publish main package
        run: |
          cd npm
          npm version "$VERSION" --no-git-tag-version --allow-same-version

          # Pin optionalDependencies to the exact release version
          npm pkg set optionalDependencies.@ivy-apps/deslop-darwin-arm64="$VERSION"
          npm pkg set optionalDependencies.@ivy-apps/deslop-linux-arm64="$VERSION"
          npm pkg set optionalDependencies.@ivy-apps/deslop-linux-x64="$VERSION"

          npm publish --access public
