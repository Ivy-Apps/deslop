name: Release to NPM

on:
  push:
    tags:
      - "v*"

# The repo-wide default is write. The build jobs do not need it, and one of them
# pipes a remote installer straight into a shell, so default to read-only here.
# publish-npm and github-release opt back in to exactly what they need.
permissions:
  contents: read

# The toolchain and flag set every build job shares, so bumping GHC or Cabal
# is one edit instead of one per job. The `for PLATFORM in $PLATFORMS` loops
# consume PLATFORMS as a word-split list, on purpose.
env:
  GHC_VERSION: "9.10.3"
  CABAL_VERSION: "3.16.0.0"
  RTS_GHC_OPTIONS: "-O2 -threaded -rtsopts -with-rtsopts=-N"
  PLATFORMS: "darwin-arm64 linux-arm64 linux-x64 win32-x64"

jobs:
  # Cheap guard that runs before the slow builds: a tag whose version does not
  # match deslop.cabal would ship a package whose `deslop --version` lies.
  # Also the single place the release's version is decided - every job below
  # reads `needs.verify-version.outputs.version` rather than re-deriving it.
  verify-version:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-base below needs main's history. checkout fetches only the
          # tagged commit at the default depth of 1.
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          # NOT a security control, and should not be mistaken for one: a tag
          # push runs the workflow as it exists *at the tagged commit*, so
          # anyone able to push a tag can push a branch with this check deleted
          # and tag that instead. Only a `v*` tag ruleset restricting who may
          # create a release tag would actually enforce this, and the repo does
          # not have one today.
          #
          # What this does buy: pushing a tag requires write access already, so
          # the realistic failure is a mistake rather than an attack - a stale
          # branch, a reverted PR, the wrong SHA. Those fail here in seconds
          # instead of shipping a release nobody reviewed.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_SHA is not contained in main; releases are cut from main only"
            exit 1
          fi
          echo "✅ $GITHUB_SHA is on main"

      - name: Check deslop.cabal matches the tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # Compared in full, on purpose. Cabal versions are dot-separated
          # numbers, so any prerelease-shaped tag (v1.0.0-rc.1) can never match
          # and is rejected here. That is the policy: this project does not ship
          # prereleases, and it also stops a typo'd tag like v0.8.1-oops from
          # burning a version number that npm will not let you reuse.
          PACKAGE_VERSION=$(sed -n 's/^version:[[:space:]]*//p' deslop.cabal | head -1 | tr -d '[:space:]')
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $TAG implies version $VERSION, but deslop.cabal declares $PACKAGE_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ deslop.cabal version $PACKAGE_VERSION matches tag $TAG"

  build-linux:
    name: Build (${{ matrix.npm-platform }})
    needs: [verify-version]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            npm-platform: linux-x64
          - os: ubuntu-24.04-arm
            npm-platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache GHC and Cabal
        uses: actions/cache@v6
        with:
          path: |
            ~/.ghcup
            ~/.cabal/store
            ~/.cabal/packages
          # GHC_VERSION is in the key because the store is only usable by the
          # compiler that built it. Without it, a GHC bump that leaves
          # cabal.project.freeze untouched restores an entry that cabal will
          # ignore, paying the download for nothing.
          key: cabal-${{ matrix.npm-platform }}-ghc${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: cabal-${{ matrix.npm-platform }}-ghc${{ env.GHC_VERSION }}-

      - name: Build static binary
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "$HOME/.ghcup:/root/.ghcup" \
            -v "$HOME/.cabal/store:/root/.cabal/store" \
            -v "$HOME/.cabal/packages:/root/.cabal/packages" \
            -w /workspace \
            -e GHC_VERSION \
            -e CABAL_VERSION \
            -e RTS_GHC_OPTIONS \
            alpine:3.20 \
            sh -c "
              apk add --no-cache \
                curl gcc g++ gmp-dev ncurses-dev ncurses-static \
                libffi-dev make xz tar perl bash \
                zlib-dev zlib-static linux-headers binutils-gold &&

              export PATH=\"/root/.ghcup/bin:\$PATH\" &&

              # Install ghcup if it is missing
              if ! command -v ghcup >/dev/null; then
                curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 BOOTSTRAP_HASKELL_MINIMAL=1 sh;
              fi &&

              # Always ensure the correct tools are installed (idempotent)
              ghcup install ghc \$GHC_VERSION &&
              ghcup set ghc \$GHC_VERSION &&
              ghcup install cabal \$CABAL_VERSION &&
              ghcup set cabal \$CABAL_VERSION &&

              cabal update &&
              # --flags=static turns on the deslop.cabal stanza that adds
              # -optl-static -optl-pthread to exe:deslop. It is opt-in because
              # it only links against musl, which is what this Alpine image has.
              cabal build exe:deslop \
                --flags=static \
                --enable-executable-static \
                --disable-executable-dynamic \
                --ghc-options=\"-fexternal-interpreter -fPIC \$RTS_GHC_OPTIONS\" &&

              mkdir -p /workspace/dist &&
              cp \$(cabal list-bin exe:deslop) /workspace/dist/deslop &&
              strip --strip-unneeded /workspace/dist/deslop &&

              # Fix permissions so the GitHub Actions runner user can cache these directories
              chown -R \$(stat -c %u:%g /workspace) /root/.ghcup /root/.cabal /workspace/dist
            "

      - name: Collect binary
        run: |
          mkdir -p dist/${{ matrix.npm-platform }}
          mv dist/deslop dist/${{ matrix.npm-platform }}/deslop

      # Runs after strip, so it validates the exact bytes that ship. The binary
      # is statically linked against musl, so it runs on the glibc host fine.
      - uses: ./.github/actions/smoke-test
        with:
          binary: dist/${{ matrix.npm-platform }}/deslop
          version: ${{ needs.verify-version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.npm-platform }}
          path: dist/${{ matrix.npm-platform }}

  build-macos:
    name: Build (darwin-arm64)
    needs: [verify-version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Cache cabal store
        uses: actions/cache@v6
        with:
          # Taken from the action rather than spelled out: it is a declared
          # output ("The path to the cabal store"), and the action moves the
          # store on some platforms. A hardcoded path that stops matching does
          # not fail - the cache just silently stops hitting.
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: cabal-darwin-arm64-ghc${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: cabal-darwin-arm64-ghc${{ env.GHC_VERSION }}-

      - run: cabal update

      - name: Build binary
        run: |
          cabal build exe:deslop \
            --ghc-options="$RTS_GHC_OPTIONS -optP-Wno-nonportable-include-path"

      - name: Collect binary
        run: |
          mkdir -p dist/darwin-arm64
          cp "$(cabal list-bin exe:deslop)" dist/darwin-arm64/deslop
          strip -x dist/darwin-arm64/deslop

      # After strip, so it validates the exact bytes that ship.
      - uses: ./.github/actions/smoke-test
        with:
          binary: dist/darwin-arm64/deslop
          version: ${{ needs.verify-version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: bin-darwin-arm64
          path: dist/darwin-arm64

  build-windows:
    name: Build (win32-x64)
    needs: [verify-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Cache cabal store
        uses: actions/cache@v6
        with:
          # haskell-actions/setup rewrites cabal's store-dir on Windows to dodge
          # MAX_PATH. Read from the action's own output rather than hardcoded,
          # for the reason given in the macOS job.
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: cabal-win32-x64-ghc${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: cabal-win32-x64-ghc${{ env.GHC_VERSION }}-

      - run: cabal update

      - name: Build binary
        shell: bash
        run: |
          cabal build exe:deslop --ghc-options="$RTS_GHC_OPTIONS"

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p dist/win32-x64
          cp "$(cabal list-bin exe:deslop)" dist/win32-x64/deslop.exe
          # Same treatment as the linux job. strip comes from mingw-w64, which
          # the runner image puts on the machine PATH; it understands PE.
          strip --strip-unneeded dist/win32-x64/deslop.exe

      # After strip, so it validates the exact bytes that ship.
      - uses: ./.github/actions/smoke-test
        with:
          binary: dist/win32-x64/deslop.exe
          version: ${{ needs.verify-version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: bin-win32-x64
          path: dist/win32-x64

  publish-npm:
    name: Publish to NPM
    # verify-version is listed even though the build jobs already depend on it:
    # `needs` outputs are only readable from a direct dependency.
    needs: [verify-version, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing exchanges this for a registry token, and it is also
      # what lets `npm publish --provenance` sign the SLSA attestation.
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@ivy-apps"
          # setup-node auto-caches when it finds a package.json with a
          # packageManager field. There is none at the repo root today, but a
          # release is the wrong place to discover that someone added one.
          package-manager-cache: false

      - run: npm install -g npm@latest

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Resolve dist-tag
        run: |
          # Belt and braces. verify-version already rejects prerelease-shaped
          # tags, so this is always `latest` today. It exists because npm never
          # infers a dist-tag from a semver prerelease suffix: if that guard is
          # ever relaxed, a bare `npm publish` would silently make an RC the
          # default install for everyone.
          case "$VERSION" in
            *-*) NPM_TAG=next ;;
            *)   NPM_TAG=latest ;;
          esac
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          echo "Publishing $VERSION under dist-tag $NPM_TAG"

      - name: Resolve pending publications
        run: |
          # The registry, not this workflow, is the source of truth for what a
          # release still owes. npm versions are immutable, so a re-run can
          # never redo a publish - it can only finish one. Deciding that here,
          # once, is what makes a tag re-runnable: v0.11.0 published three of
          # its five packages, died on a bad credential, and the retry then
          # failed in Preflight instead of picking up where it left off.
          #
          # The consequence worth knowing before you trust a green tick: this
          # job publishing nothing at all is a success, not a bug. If every
          # package is already up, there is nothing left for it to do.
          #
          # A non-zero `npm view` is either E404 (genuinely unpublished) or a
          # transient registry error, and npm does not make those cheap to tell
          # apart. Both are read as "pending", which is the safe direction: a
          # blip makes us attempt a publish that npm then rejects loudly, and
          # you re-run. The unsafe direction - concluding "already published"
          # about a package that is not there, and so exiting 0 on a release
          # that shipped nothing - needs the registry to affirmatively hand
          # back a version, so it cannot happen by accident.
          PENDING_PLATFORMS=""
          for PLATFORM in $PLATFORMS; do
            PKG="@ivy-apps/deslop-$PLATFORM"
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              echo "$PKG@$VERSION is already published, skipping"
            else
              PENDING_PLATFORMS="${PENDING_PLATFORMS:+$PENDING_PLATFORMS }$PLATFORM"
            fi
          done

          if npm view "@ivy-apps/deslop@$VERSION" version >/dev/null 2>&1; then
            echo "@ivy-apps/deslop@$VERSION is already published, skipping"
            MAIN_PENDING=false
          else
            MAIN_PENDING=true
          fi

          echo "PENDING_PLATFORMS=$PENDING_PLATFORMS" >> "$GITHUB_ENV"
          echo "MAIN_PENDING=$MAIN_PENDING" >> "$GITHUB_ENV"
          echo "Platform packages to publish: ${PENDING_PLATFORMS:-none}"
          echo "Main package to publish: $MAIN_PENDING"

      - name: Stage packages
        run: |
          for PLATFORM in $PLATFORMS; do
            PKG_DIR="npm/packages/$PLATFORM"
            mkdir -p "$PKG_DIR/bin"

            # Each artifact directory holds exactly one file, so the binary's
            # name is read off the file that is there rather than decided in
            # advance. That keeps win32-x64's .exe suffix out of this loop and
            # leaves PLATFORMS as the only place the platform list is written.
            BINARY_PATH=$(find "dist/bin-$PLATFORM" -type f -print -quit)
            if [ -z "$BINARY_PATH" ]; then
              echo "::error::No deslop binary found for $PLATFORM in dist/bin-$PLATFORM"
              exit 1
            fi
            BINARY_NAME=$(basename "$BINARY_PATH")
            cp "$BINARY_PATH" "$PKG_DIR/bin/$BINARY_NAME"
            chmod +x "$PKG_DIR/bin/$BINARY_NAME"

            (cd "$PKG_DIR" && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          done

          cd npm
          npm version "$VERSION" --no-git-tag-version --allow-same-version

          # Pin optionalDependencies to the exact release version
          npm pkg set optionalDependencies.@ivy-apps/deslop-darwin-arm64="$VERSION"
          npm pkg set optionalDependencies.@ivy-apps/deslop-linux-arm64="$VERSION"
          npm pkg set optionalDependencies.@ivy-apps/deslop-linux-x64="$VERSION"
          npm pkg set optionalDependencies.@ivy-apps/deslop-win32-x64="$VERSION"

      - name: Preflight
        run: |
          # npm has no multi-package transaction and published versions are
          # immutable, so a failure halfway down the publish loop leaves a
          # release that can only ever be finished, never redone under the same
          # version number. This step moves every failure that does not require
          # writing to the registry - a bad manifest, a missing bin, a file the
          # `files` allowlist drops - ahead of the first real publish.
          #
          # What it does NOT check is credentials. A dry run fetches the
          # packument and stops, so it never performs the Trusted Publishing
          # token exchange. v0.11.0 is the proof: Preflight passed for
          # win32-x64, and the real publish of that same package then died on a
          # `404 Not Found - PUT`. Nothing here can catch a bad credential
          # ahead of the first real publish.
          #
          # --provenance is deliberately absent here: signing writes a public
          # Sigstore transparency-log entry, which is not something a dry run
          # should be doing. Packing and manifest validation are what is
          # being checked.
          #
          # Only pending packages are preflighted. A dry run still asks the
          # registry, and the registry rejects a version that already exists -
          # which is exactly how the v0.11.0 retry died, on the first package
          # of the loop, before ever reaching the guarded publish steps below.
          for PLATFORM in $PENDING_PLATFORMS; do
            (cd "npm/packages/$PLATFORM" && npm publish --dry-run --access public --tag "$NPM_TAG")
          done
          if [ "$MAIN_PENDING" = true ]; then
            (cd npm && npm publish --dry-run --access public --tag "$NPM_TAG")
          fi

      - name: Publish platform packages
        run: |
          # Every package authenticates over OIDC and nothing else: there is no
          # publish token anywhere in this job, so Trusted Publishing is the
          # only auth path a package can take.
          #
          # --provenance is passed explicitly rather than left to npm. npm
          # does auto-enable it under Trusted Publishing, but that path is
          # wrapped in a catch-all that logs at verbose and gives up, and it
          # depends on a live package-visibility lookup - so a transient
          # failure ships an unattested package and still exits 0. Asking for
          # it makes it a requirement instead of a best effort.
          for PLATFORM in $PENDING_PLATFORMS; do
            (cd "npm/packages/$PLATFORM" && \
              npm publish --access public --provenance --tag "$NPM_TAG")
          done

      - name: Publish main package
        run: |
          # Published last, on purpose: the platform packages are
          # optionalDependencies of this one, so until it goes out a partially
          # published release is not reachable by any user. That is also why a
          # half-finished release is safe to walk away from - v0.11.0 left
          # three platform packages on the registry that nothing can resolve
          # to, because this step never ran.
          if [ "$MAIN_PENDING" = true ]; then
            (cd npm && npm publish --access public --provenance --tag "$NPM_TAG")
          fi

  github-release:
    name: GitHub Release
    needs: [verify-version, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `git describe` needs the full tag history to find the previous tag
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Package binaries
        run: |
          mkdir -p release
          for PLATFORM in $PLATFORMS; do
            # As in the publish job: one file per artifact directory, so the
            # name is read off it rather than branched on the platform.
            BINARY_PATH=$(find "dist/bin-$PLATFORM" -type f -print -quit)
            if [ -z "$BINARY_PATH" ]; then
              echo "::error::No deslop binary found for $PLATFORM in dist/bin-$PLATFORM"
              exit 1
            fi
            # tar preserves the executable bit; a bare GitHub asset does not
            chmod +x "$BINARY_PATH"
            tar -czf "release/deslop-$PLATFORM.tar.gz" \
              -C "$(dirname "$BINARY_PATH")" "$(basename "$BINARY_PATH")"
          done
          cd release
          sha256sum ./*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of an already-released tag: refresh the assets, keep the notes
            echo "Release $TAG already exists, updating assets"
            gh release upload "$TAG" release/deslop-*.tar.gz release/checksums.txt --clobber
            exit 0
          fi

          NOTES=$(printf '%s\n' \
            '## 📦 Install' \
            '' \
            '```bash' \
            "npm install --save-dev @ivy-apps/deslop@$VERSION" \
            '```' \
            '' \
            "NPM: https://www.npmjs.com/package/@ivy-apps/deslop/v/$VERSION" \
            '')

          ARGS=(--title "$TAG" --notes "$NOTES" --generate-notes)

          # --generate-notes otherwise starts from the previous *release*, which
          # can be many versions behind the previous *tag*
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            ARGS+=(--notes-start-tag "$PREV")
          fi

          # v1.0.0-rc1 and friends are prereleases
          case "$TAG" in
            *-*) ARGS+=(--prerelease) ;;
          esac

          gh release create "$TAG" "${ARGS[@]}" release/deslop-*.tar.gz release/checksums.txt
