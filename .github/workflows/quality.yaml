name: Quality

on:
  push:
    branches:
      - main
  pull_request:

# Rapid pushes to a PR cancel the stale run. Pushes to main are never
# cancelled, so a green main always means that exact commit passed.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          # This org is not on FlakeHub; without this the action logs a red
          # (non-fatal) auth error. The GitHub Actions cache does the work.
          use-flakehub: false

      # Realises the `ci` dev shell and fetches the Hackage index that
      # `cabal.project`'s pinned index-state requires. Every later step reuses
      # both, so this is where the one-off setup cost is visible.
      - name: ❄️ Toolchain
        run: nix develop .#ci --accept-flake-config -c cabal update

      # One step per `just check` recipe, in the same order, so a red run
      # names the stage that failed. `just check` is the local full pipeline:
      # a recipe added there must be added here too.
      - name: 🎨 Format
        run: nix develop .#ci --accept-flake-config -c just format-check

      - name: 🔍 Lint
        run: nix develop .#ci --accept-flake-config -c just lint

      - name: 🔍 Lint workflows
        run: nix develop .#ci --accept-flake-config -c just lint-actions

      - name: 🏗️ Build
        run: nix develop .#ci --accept-flake-config -c just build

      # CI-only: the dev shells do not carry the benchmark's dependencies, and
      # agents never build it.
      - name: ⏱️ Build benchmark
        run: nix develop .#ci --accept-flake-config -c just build-bench

      - name: 🧪 Test
        run: nix develop .#ci --accept-flake-config -c just test

      - name: 🧪 Explorer tests
        run: nix develop .#ci --accept-flake-config -c just test-js

      - name: 🏖️ Integration
        run: nix develop .#ci --accept-flake-config -c just integration

      - name: ✨ Own Deslop rules (dogfood)
        run: nix develop .#ci --accept-flake-config -c just deslop-self
