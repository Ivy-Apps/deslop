name: Quality

on:
  push:
    branches:
      - main
  pull_request:

# Rapid pushes to a PR cancel the stale run. Pushes to main are never
# cancelled, so a green main always means that exact commit passed.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three independent jobs run in parallel, and `Check` gathers them into the one
# status the repository ruleset requires. Between them they run one step per
# `just check` recipe, so a red run names the stage that failed. `just check`
# is the local full pipeline: a recipe added there must be added to one of
# these jobs too.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          # This org is not on FlakeHub; without this the action logs a red
          # (non-fatal) auth error. The GitHub Actions cache does the work.
          use-flakehub: false

      # Realises the `ci` dev shell, so its one-off cost is not billed to the
      # first lint step. The linters need no cabal, so no Hackage index.
      - name: ❄️ Toolchain
        run: nix develop .#ci --accept-flake-config -c true

      - name: 🎨 Format
        run: nix develop .#ci --accept-flake-config -c just format-check

      - name: 🔍 Lint
        run: nix develop .#ci --accept-flake-config -c just lint

      - name: 🔍 Lint workflows
        run: nix develop .#ci --accept-flake-config -c just lint-actions

  build-test:
    name: Build and test
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      # Realises the `ci` dev shell and fetches the Hackage index that
      # `cabal.project`'s pinned index-state requires. Every later step reuses
      # both, so this is where the one-off setup cost is visible. It also asks
      # cabal where its store is rather than assuming: on the runner it is the
      # XDG ~/.local/state/cabal/store, but only because ~/.cabal is absent.
      - name: ❄️ Toolchain
        id: toolchain
        run: |
          nix develop .#ci --accept-flake-config -c cabal update
          echo "store-dir=$(nix develop .#ci --accept-flake-config -c cabal path --store-dir)" >> "$GITHUB_OUTPUT"

      # The Hackage packages the Nix shell does not provide, compiled once and
      # reused until the toolchain or a dependency pin changes. A miss restores
      # the newest store for this runner, so a pin bump rebuilds only what it
      # changed. The Hackage index is not cached: at over 1GB it restores no
      # faster than `cabal update` downloads it.
      - name: 📦 Cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.toolchain.outputs.store-dir }}
          key: cabal-store-build-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze', 'deslop.cabal') }}
          restore-keys: cabal-store-build-test-${{ runner.os }}-${{ runner.arch }}-

      - name: 🏗️ Build
        run: nix develop .#ci --accept-flake-config -c just build

      - name: 🧪 Test
        run: nix develop .#ci --accept-flake-config -c just test

      - name: 🧪 Explorer tests
        run: nix develop .#ci --accept-flake-config -c just test-js

      - name: 🏖️ Integration
        run: nix develop .#ci --accept-flake-config -c just integration

      - name: ✨ Own Deslop rules (dogfood)
        run: nix develop .#ci --accept-flake-config -c just deslop-self

      # CI-only: the explorer of this repository, as the binary just built
      # draws it, for a reviewer to download and open.
      - name: 🗺️ Explorer
        run: nix develop .#ci --accept-flake-config -c cabal run -v0 deslop -- explore . --ci

      - name: 📦 Upload explorer
        uses: actions/upload-artifact@v7
        with:
          name: explorer
          path: deslop/diagram/index.html
          if-no-files-found: error

  # CI-only: the dev shells do not carry the benchmark's dependencies, and
  # agents never build it. A job of its own because it is the longest single
  # compile, with its own store key because its dependencies differ.
  bench:
    name: Benchmark
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      # As in build-test: the shell, the Hackage index and the store's path.
      - name: ❄️ Toolchain
        id: toolchain
        run: |
          nix develop .#ci --accept-flake-config -c cabal update
          echo "store-dir=$(nix develop .#ci --accept-flake-config -c cabal path --store-dir)" >> "$GITHUB_OUTPUT"

      - name: 📦 Cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.toolchain.outputs.store-dir }}
          key: cabal-store-bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze', 'deslop.cabal') }}
          restore-keys: cabal-store-bench-${{ runner.os }}-${{ runner.arch }}-

      - name: ⏱️ Build benchmark
        run: nix develop .#ci --accept-flake-config -c just build-bench

  # The status check the repository ruleset requires: green only when every job
  # above succeeded. `always()` makes it report even when one failed or was
  # skipped, because a required check that never reports blocks the merge
  # without saying why.
  check:
    name: Check
    needs: [lint, build-test, bench]
    if: always()
    runs-on: ubuntu-24.04-arm
    permissions: {}
    steps:
      - name: ✅ Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required job ended '$result'."
              exit 1
            fi
          done
