name: Mutation testing

# Its own workflow, on purpose outside `Check`: mutation testing is advisory.
on:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Rapid pushes to a PR cancel the stale run. Other runs are never cancelled.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # It goes red when its numbers would be false: a test failing at baseline or a
  # failed control. A survivor never does. x86_64 only, the one system sydtest's
  # mutation stack is proven on. The Nix cache may not hold sydtest, so a run may
  # rebuild it from source.
  mutation:
    name: Mutation testing
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: 🧬 Mutation testing
        run: nix develop .#ci --accept-flake-config -c just mutation

      - name: 📊 Score
        run: cat result/score.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📄 Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: |
            result/deslop/report.json
            result/deslop/report.txt
          if-no-files-found: error
