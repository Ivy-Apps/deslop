<!doctype html>
<!--
  Deslop's module graph explorer, written by `deslop explore`.
  One self-contained page: the graph and every script it runs are inline below,
  so it opens from disk, offline. The graph is computed by Deslop
  (src/Deslop/Diagram.hs): this script only draws it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Module graph</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1f2328; --muted: #6b7280; --panel: #ffffff; --line: #d0d4da;
    --edge: #3b4252; --accent: #d9480f; --folder-fg: #374151; --shadow: 0 2px 12px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --fg: #e6e8eb; --muted: #9aa3ae; --panel: #1f2226; --line: #363b42;
      --edge: #c9d1d9; --accent: #ff922b; --folder-fg: #d1d5db; --shadow: 0 2px 12px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #cy { position: fixed; inset: calc(env(safe-area-inset-top, 0) + 60px) 0 0 0; }
  #bar { position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; display: flex; gap: 8px;
    padding: 8px; z-index: 3; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  #search-field { position: relative; flex: 1; min-width: 0; }
  #search { width: 100%; height: 44px; padding: 0 44px 0 14px; border: 1px solid var(--line); border-radius: 22px;
    background: var(--panel); color: var(--fg); font-size: 16px; box-shadow: var(--shadow); }
  #search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  #clear-search { position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0; border: 0; box-shadow: none;
    background: none; color: var(--muted); font-size: 18px; }
  button, a.button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
    border-radius: 22px; min-height: 44px; padding: 0 14px; box-shadow: var(--shadow); cursor: pointer; }
  #results { position: fixed; top: calc(env(safe-area-inset-top, 0) + 58px); left: 8px; right: 8px; z-index: 4;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
    max-height: 50vh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .row { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; box-shadow: none;
    border-bottom: 1px solid var(--line); padding: 10px 14px; min-height: 44px; background: none; }
  .row span { display: block; overflow-wrap: anywhere; }
  .row b { color: var(--accent); font-weight: 700; }
  .row small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #options { position: fixed; top: calc(env(safe-area-inset-top, 0) + 58px); right: 8px; z-index: 4; padding: 6px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  #options label { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  #options input { width: 22px; height: 22px; }
  #legend { position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0) + 8px); z-index: 2;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; font-size: 12px;
    box-shadow: var(--shadow); opacity: .94; display: flex; flex-wrap: wrap; column-gap: 6px; row-gap: 6px; }
  #legend .key { display: flex; align-items: center; gap: 5px; }
  /* A folder key is a pill: outlined while its folder is closed, tinted in the folder's colour while it is open. */
  #legend button.key { font-size: inherit; min-height: 28px; padding: 0 10px; border: 0; border-radius: 999px;
    box-shadow: inset 0 0 0 1px var(--line); background: none; }
  #legend button.key.open { font-weight: 700; background: color-mix(in srgb, var(--key) 22%, transparent);
    box-shadow: inset 0 0 0 1.5px var(--key); }
  #reset { width: 44px; padding: 0; font-size: 20px; }
  #toggle-options { position: relative; width: 44px; padding: 0; display: flex; align-items: center; justify-content: center; }
  #toggle-options.filtering::after { content: ""; position: absolute; top: 8px; right: 8px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent); }
  #legend .hubs, #legend .hint { flex-basis: 100%; }
  #legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  #legend .hubs { color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 2px; }
  /* An info icon: a 32px tap target that sits inside its row without making it taller. */
  button.info { flex: none; width: 32px; min-height: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%;
    box-shadow: none; background: none; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
  #legend button.info { margin: -8px 0; }
  #info { position: fixed; z-index: 6; max-width: min(320px, calc(100vw - 16px)); padding: 10px 12px; font-size: 14px;
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  #legend .hint { color: var(--muted); margin-top: 4px; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; max-height: 42vh; overflow-y: auto;
    background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
    padding: 12px 16px calc(env(safe-area-inset-bottom, 0) + 16px); }
  /* The sheet's title row: the name takes what the actions leave, and wraps rather than pushing them off. */
  #sheet .head { display: flex; align-items: center; gap: 8px; margin: -4px -8px 2px 0; }
  #sheet h2 { flex: 1; min-width: 0; font-size: 18px; margin: 0; word-break: break-word; }
  #sheet .actions { flex: none; display: flex; gap: 4px; }
  a.button { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; box-shadow: none; }
  #sheet .path { color: var(--muted); font-size: 13px; word-break: break-all; }
  #sheet h3 { font-size: 14px; margin: 14px 0 4px; color: var(--muted); font-weight: 600; }
  #sheet .badge { display: inline-block; font-size: 12px; padding: 2px 8px; margin: 6px 6px 0 0; border-radius: 10px;
    border: 1px solid var(--line); }
  #close { width: 34px; padding: 0; box-shadow: none; display: inline-flex; align-items: center; justify-content: center; }
  /* The sheet's actions are smaller than the bar's buttons, so the module name keeps the room. */
  #sheet .actions > * { min-height: 34px; height: 34px; font-size: 13px; }
  #sheet .actions a.button { padding: 0 10px; }
  /* A changed module's diff with no pull request to open it in: a badge in the Diff button's place, not a control. */
  #sheet .actions .chip { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 22px;
    border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--fg); cursor: default; }
  #sheet .row { padding-left: 0; }
  @media (max-width: 600px) { #sheet { max-height: 34vh; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="cy"></div>
<div id="bar">
  <div id="search-field">
    <input id="search" type="search" placeholder="Find a module" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="clear-search" aria-label="Clear search" hidden>✕</button>
  </div>
  <button id="reset" aria-label="Reset" title="Reset">↺</button>
  <button id="toggle-options" aria-label="Filters" title="Filters" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/>
    </svg>
  </button>
</div>
<div id="results" hidden></div>
<div id="options" hidden>
  <label id="diff-option"><input type="checkbox" data-show="diff"> Diff only</label>
  <label><input type="checkbox" data-show="tests"> Tests</label>
  <label><input type="checkbox" data-show="benches"> Benchmarks</label>
  <label><input type="checkbox" data-show="hubs"> Used everywhere</label>
  <label><input type="checkbox" data-show="implied"> Implied arrows</label>
  <label><input type="checkbox" data-show="externals"> Packages</label>
</div>
<div id="legend"></div>
<div id="info" role="tooltip" hidden></div>
<section id="sheet" hidden></section>
<script id="graph" type="application/json">/* deslop:graph */</script>
<!-- deslop:libraries -->
<script>
"use strict";
(function () {
  var graph = JSON.parse(document.getElementById("graph").textContent);
  if (graph.schema !== "deslop-graph/1") {
    document.body.textContent = "This page cannot read a graph of schema " + graph.schema + ".";
    return;
  }

  // ---- The graph, indexed ------------------------------------------------
  var nodes = {}, children = {}, outgoing = {}, incoming = {};
  graph.nodes.forEach(function (n) {
    n.tags = n.tags || [];
    nodes[n.id] = n;
    children[n.id] = [];
    outgoing[n.id] = [];
    incoming[n.id] = [];
  });
  graph.nodes.forEach(function (n) { if (n.parent) children[n.parent].push(n.id); });
  graph.edges.forEach(function (e) { outgoing[e.source].push(e); incoming[e.target].push(e); });
  var modules = graph.nodes.filter(function (n) { return n.kind === "module"; });
  var roots = graph.nodes.filter(function (n) { return n.kind !== "external" && !n.parent; }).map(function (n) { return n.id; });

  function has(n, tag) { return n.tags.indexOf(tag) >= 0; }
  function ancestors(id) {
    var out = [], p = nodes[id].parent;
    while (p) { out.unshift(p); p = nodes[p].parent; }
    return out;
  }

  // Colour by top-level folder; the one holding most of the source is split into its own sub-folders.
  var palette = ["#4c6ef5", "#12b886", "#f59f00", "#e64980", "#7950f2", "#15aabf", "#fa5252", "#82c91e", "#fd7e14", "#868e96"];
  var groupOf = (function () {
    var bySegment = {};
    var sources = modules.filter(function (m) { return !has(m, "test") && !has(m, "bench"); });
    sources.forEach(function (m) { var a = ancestors(m.id)[0] || ""; bySegment[a] = (bySegment[a] || 0) + 1; });
    var biggest = Object.keys(bySegment).sort(function (a, b) { return bySegment[b] - bySegment[a]; })[0];
    var split = bySegment[biggest] > sources.length / 2;
    return function (id) {
      var a = ancestors(id);
      if (nodes[id].kind === "folder") a.push(id);
      if (split && a[0] === biggest && a[1]) return a[1];
      return a[0] || "";
    };
  })();
  var groups = [];
  modules.forEach(function (m) { var g = groupOf(m.id); if (groups.indexOf(g) < 0) groups.push(g); });
  groups.sort();
  function colourOf(id) { return palette[groups.indexOf(groupOf(id)) % palette.length]; }
  function groupLabel(g) { return g ? nodes[g].path + "/" : "(root)"; }

  // ---- What is shown -------------------------------------------------------
  var show = { diff: false, tests: false, benches: false, hubs: false, implied: false, externals: false };
  var expanded = {};
  var focused = null;

  function moduleShown(n) {
    return (show.tests || !has(n, "test")) && (show.benches || !has(n, "bench")) && (show.hubs || !has(n, "hub"));
  }
  // ---- Diff only -------------------------------------------------------------
  var changedModules = modules.filter(function (m) { return has(m, "changed"); });
  if (!changedModules.length) document.getElementById("diff-option").remove();
  // What a drawn node stands for has changed: the module itself, or a shown module inside the folder.
  function changedSet() {
    var set = {};
    changedModules.forEach(function (m) {
      if (!moduleShown(m)) return;
      set[m.id] = true;
      ancestors(m.id).forEach(function (f) { set[f] = true; });
    });
    return set;
  }
  // Opens every folder holding a shown changed module.
  function openChanged() {
    changedModules.forEach(function (m) {
      if (moduleShown(m)) ancestors(m.id).forEach(function (f) { expanded[f] = true; });
    });
  }
  var shownCount = {};
  function countShown() {
    shownCount = {};
    modules.forEach(function (m) {
      if (!moduleShown(m)) return;
      ancestors(m.id).forEach(function (f) { shownCount[f] = (shownCount[f] || 0) + 1; });
    });
  }
  // The drawn node standing for a module or folder: its outermost collapsed folder, or itself.
  function representative(id) {
    var a = ancestors(id);
    for (var i = 0; i < a.length; i++) if (!expanded[a[i]]) return a[i];
    return id;
  }
  function drawnCount() {
    var count = 0;
    (function walk(ids) {
      ids.forEach(function (id) {
        var n = nodes[id];
        if (n.kind === "module") { if (moduleShown(n)) count++; return; }
        if (!shownCount[id]) return;
        count++;
        if (expanded[id]) walk(children[id]);
      });
    })(roots);
    return count;
  }
  // Opens the biggest folders first, while the picture stays small enough to read.
  function autoExpand(budget) {
    countShown();
    for (;;) {
      var candidates = Object.keys(shownCount).filter(function (f) {
        return !expanded[f] && ancestors(f).every(function (a) { return expanded[a]; });
      }).sort(function (a, b) { return shownCount[b] - shownCount[a]; });
      var opened = false;
      for (var i = 0; i < candidates.length && !opened; i++) {
        expanded[candidates[i]] = true;
        if (drawnCount() <= budget) opened = true; else delete expanded[candidates[i]];
      }
      if (!opened) return;
    }
  }

  function elements() {
    countShown();
    var els = [], drawn = {};
    var changed = show.diff ? changedSet() : null;
    function diffClass(id) { return changed ? (changed[id] ? " changed" : " unchanged") : ""; }
    function layerOf(id) {
      var n = nodes[id];
      if (n.kind === "module") return n.layer;
      var min = Infinity;
      modules.forEach(function (m) { if (moduleShown(m) && ancestors(m.id).indexOf(id) >= 0) min = Math.min(min, m.layer); });
      return min;
    }
    (function walk(ids, parent) {
      ids.forEach(function (id) {
        var n = nodes[id];
        if (n.kind === "module" && !moduleShown(n)) return;
        if (n.kind === "folder" && !shownCount[id]) return;
        var open = n.kind === "folder" && expanded[id];
        var label = n.kind === "module" ? fileLabel(n.path) : n.label + "/" + (open ? "" : "  " + shownCount[id]);
        drawn[id] = true;
        els.push({ group: "nodes", classes: n.kind + (open ? " open" : "") + (has(n, "hub") ? " hub" : "") + (has(n, "test") ? " test" : "") + (has(n, "bench") ? " bench" : "") + diffClass(id),
          data: { id: id, parent: parent, label: label, colour: colourOf(id), layer: layerOf(id) } });
        if (open) walk(children[id], id);
      });
    })(roots, undefined);
    if (show.externals) graph.nodes.forEach(function (n) {
      if (n.kind !== "external") return;
      drawn[n.id] = true;
      els.push({ group: "nodes", classes: "external" + diffClass(n.id), data: { id: n.id, label: n.name, colour: "#868e96", layer: 1e6 } });
    });
    var merged = {};
    graph.edges.forEach(function (e) {
      if (!show.implied && has(e, "implied")) return;
      var s = representative(e.source), t = representative(e.target);
      if (!drawn[s] || !drawn[t] || s === t) return;
      var key = s + "\u0000" + t;
      merged[key] = merged[key] || { source: s, target: t, count: 0, reexport: true };
      merged[key].count += e.count;
      merged[key].reexport = merged[key].reexport && e.kind === "reexport";
    });
    Object.keys(merged).forEach(function (k) {
      var e = merged[k];
      var dim = changed && !changed[e.source] && !changed[e.target];
      els.push({ group: "edges", classes: (e.reexport ? "reexport" : "") + (dim ? " unchanged" : ""), data: { id: k, source: e.source, target: e.target, count: e.count } });
    });
    return els;
  }
  function fileLabel(path) {
    var file = path.split("/").pop();
    var dot = file.lastIndexOf(".");
    return dot > 0 ? file.slice(0, dot) : file;
  }

  // ---- Drawing ---------------------------------------------------------------
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  // An edge's colour at its importer end: faded towards the background so the direction reads, yet still visible.
  function faded(name) { return mix(css(name), css("--bg"), 0.45); }
  // The #rrggbb colour that is `weight` of `a` and the rest of `b`.
  function mix(a, b, weight) {
    function channels(hex) { return [1, 3, 5].map(function (i) { return parseInt(hex.slice(i, i + 2), 16); }); }
    var x = channels(a), y = channels(b);
    return "#" + x.map(function (c, i) { return ("0" + Math.round(c * weight + y[i] * (1 - weight)).toString(16)).slice(-2); }).join("");
  }
  function style() {
    return [
      { selector: "node", style: { "label": "data(label)", "font-size": 13, "min-zoomed-font-size": 9, "color": css("--fg"),
        "text-valign": "center", "text-halign": "center", "shape": "round-rectangle",
        "width": function (n) { return Math.max(40, n.data("label").length * 7.4 + 18); }, "height": 28,
        "background-color": "data(colour)", "background-opacity": 0.22, "border-width": 1.5, "border-color": "data(colour)" } },
      { selector: "node.folder", style: { "font-weight": "bold", "background-opacity": 0.4, "border-width": 2.5, "height": 40, "font-size": 15,
        "width": function (n) { return Math.max(60, n.data("label").length * 8.6 + 24); } } },
      { selector: "node.open", style: { "text-valign": "top", "text-halign": "center", "text-margin-y": -4, "background-opacity": 0.06,
        "border-width": 1.5, "border-style": "dashed", "font-size": 14, "color": css("--folder-fg"), "padding": 10, "events": "no" } },
      { selector: "node.test", style: { "border-style": "dotted" } },
      { selector: "node.bench", style: { "border-style": "dashed" } },
      { selector: "node.module.changed", style: { "border-color": css("--accent"), "border-width": 3 } },
      { selector: ".unchanged", style: { "opacity": 0.2 } },
      { selector: "node.external", style: { "shape": "rectangle", "background-opacity": 0.1 } },
      { selector: "edge", style: { "width": function (e) { return Math.min(4, 1 + Math.log2(e.data("count"))); },
        "line-color": css("--edge"), "target-arrow-color": css("--edge"), "target-arrow-shape": "triangle", "arrow-scale": 0.8,
        "curve-style": "bezier", "opacity": 0.22, "events": "no",
        // Faint at the importer, solid at what it imports.
        "line-fill": "linear-gradient", "line-gradient-stop-colors": faded("--edge") + " " + css("--edge"), "line-gradient-stop-positions": "0% 100%" } },
      { selector: "edge.reexport", style: { "line-style": "dashed" } },
      { selector: "edge.moving", style: { "display": "none" } },
      { selector: ".faded", style: { "opacity": 0.08 } },
      { selector: "edge.lit", style: { "opacity": 0.9, "line-color": css("--accent"), "target-arrow-color": css("--accent"), "z-index": 9,
        "line-gradient-stop-colors": faded("--accent") + " " + css("--accent") } },
      { selector: "node.lit", style: { "border-width": 3, "background-opacity": 0.45, "opacity": 1 } },
      { selector: "node.picked", style: { "border-color": css("--accent"), "border-width": 4, "opacity": 1 } }
    ];
  }

  var cy = cytoscape({ container: document.getElementById("cy"), style: style(),
    boxSelectionEnabled: false, autoungrabify: true, autounselectify: true, minZoom: 0.05, maxZoom: 4 });
  window.deslopExplorer = { cy: cy, ready: false, layouts: 0 };

  function layout(then) {
    syncLegendSelection();
    var previous = {};
    cy.nodes().forEach(function (n) { previous[n.id()] = n.position(); });
    cy.batch(function () {
      cy.elements().remove();
      cy.add(elements());
      cy.nodes().forEach(function (n) {
        var from = previous[n.id()] || ancestors(n.id()).map(function (a) { return previous[a]; }).filter(Boolean).pop();
        if (from) n.position({ x: from.x, y: from.y });
      });
    });
    var animate = Object.keys(previous).length > 0;
    // Nodes start stacked where their folder was, so edges wait until they have moved apart.
    if (animate) cy.edges().addClass("moving");
    cy.layout({
      name: "elk", nodeDimensionsIncludeLabels: true, fit: false, animate: animate, animationDuration: 280,
      elk: { "algorithm": "layered", "elk.direction": "DOWN", "elk.hierarchyHandling": "INCLUDE_CHILDREN",
        "elk.partitioning.activate": true, "elk.layered.spacing.nodeNodeBetweenLayers": 44, "elk.spacing.nodeNode": 14,
        "elk.layered.spacing.edgeNodeBetweenLayers": 12, "elk.padding": "[top=30,left=12,bottom=12,right=12]",
        "elk.layered.crossingMinimization.forceNodeModelOrder": false, "elk.layered.nodePlacement.strategy": "NETWORK_SIMPLEX" },
      nodeLayoutOptions: function (n) { return { "elk.partitioning.partition": n.data("layer") }; },
      stop: function () {
        window.deslopExplorer.layouts++;
        cy.edges().removeClass("moving");
        if (focused && cy.getElementById(focused).length) highlight(focused);
        if (then) then();
      }
    }).run();
  }

  // ---- Interaction -------------------------------------------------------------
  cy.on("tap", "node", function (ev) {
    var n = nodes[ev.target.id()];
    if (n.kind === "folder") { toggleFolder(n.id); return; }
    focus(n.id, false);
  });
  // An open folder takes no events, so a drag on it pans; a tap on its name still closes it.
  cy.on("tap", function (ev) {
    if (ev.target !== cy) return;
    var hit = openFolderNamed(ev.position);
    if (hit) toggleFolder(hit.id()); else clearFocus();
  });

  // The innermost open folder whose name is under the point, padded for a finger.
  function openFolderNamed(p) {
    var pad = 8;
    return cy.nodes(".open").filter(function (n) {
      var b = n.boundingBox({ includeNodes: false, includeEdges: false, includeLabels: true, includeOverlays: false, useCache: false });
      return p.x >= b.x1 - pad && p.x <= b.x2 + pad && p.y >= b.y1 - pad && p.y <= b.y2 + pad;
    }).sort(function (a, b) { return b.ancestors().length - a.ancestors().length; })[0];
  }

  function toggleFolder(id) {
    if (expanded[id]) {
      Object.keys(expanded).forEach(function (f) { if (f === id || ancestors(f).indexOf(id) >= 0) delete expanded[f]; });
      layout(function () { cy.animate({ center: { eles: cy.getElementById(id) }, duration: 250 }); });
    } else {
      // A legend key can name a folder inside a closed one: open the way down to it too.
      ancestors(id).concat([id]).forEach(function (f) { expanded[f] = true; });
      layout(function () { frame(cy.getElementById(id)); });
    }
  }

  var options = document.getElementById("options"), optionsButton = document.getElementById("toggle-options");
  optionsButton.onclick = function () {
    options.hidden = !options.hidden;
    optionsButton.setAttribute("aria-expanded", String(!options.hidden));
  };
  // A tap anywhere else dismisses the results, the filters and the info popover. Capture, since the canvas swallows its taps.
  document.addEventListener("pointerdown", function (ev) {
    var t = ev.target;
    var onInfo = info.contains(t) || !!(t.closest && t.closest("button.info"));
    if (!results.contains(t) && !document.getElementById("search-field").contains(t)) results.hidden = true;
    if (!options.contains(t) && !optionsButton.contains(t) && !onInfo) closeOptions();
    if (!onInfo) hideInfo();
  }, true);
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") hideInfo(); });
  function closeOptions() {
    options.hidden = true;
    optionsButton.setAttribute("aria-expanded", "false");
  }
  function markFilters() {
    optionsButton.classList.toggle("filtering", Object.keys(show).some(function (k) { return show[k]; }));
  }
  function syncOptions() {
    options.querySelectorAll("input").forEach(function (box) { box.checked = show[box.dataset.show]; });
    markFilters();
    renderLegend();
  }
  options.querySelectorAll("input").forEach(function (box) {
    box.parentNode.appendChild(infoButton(box.parentNode.textContent.trim(), explanations[box.dataset.show]));
    box.onchange = function () {
      show[box.dataset.show] = box.checked;
      markFilters();
      renderLegend();
      if (!show.diff) { layout(); return; }
      openChanged();
      layout(function () { cy.animate({ fit: { eles: cy.elements(), padding: 16 }, duration: 250 }); });
    };
  });
  function renderLegend() {
    var legend = document.getElementById("legend");
    legend.innerHTML = "";
    countShown();
    groups.filter(function (g) {
      return modules.some(function (m) { return moduleShown(m) && groupOf(m.id) === g; });
    }).forEach(function (g) {
      var key = el(g ? "button" : "div", { "class": "key" });
      var colour = palette[groups.indexOf(g) % palette.length];
      if (g) {
        key.onclick = function () { toggleFolder(g); };
        key.dataset.folder = g;
        key.style.setProperty("--key", colour);
      }
      var swatch = el("i");
      swatch.style.background = colour;
      key.appendChild(swatch);
      key.appendChild(document.createTextNode(groupLabel(g)));
      legend.appendChild(key);
    });
    var hubs = modules.filter(function (m) { return has(m, "hub"); });
    if (hubs.length && !show.hubs) {
      var hidden = el("div", { "class": "hubs" });
      hidden.appendChild(el("span", {}, "Hidden: " + hubs.map(function (m) { return fileLabel(m.path); }).join(", ")));
      hidden.appendChild(infoButton("Used everywhere", explanations.hiddenHubs));
      legend.appendChild(hidden);
    }
    legend.appendChild(el("div", { "class": "hint" }, "Arrows point at what is imported. Tap a folder to open it, tap its name to close it."));
    syncLegendSelection();
  }

  // Every open or close ends in layout(), which calls this, so a folder key always shows whether its folder is open.
  function syncLegendSelection() {
    document.querySelectorAll("#legend button.key").forEach(function (key) {
      var open = !!expanded[key.dataset.folder];
      key.classList.toggle("open", open);
      key.setAttribute("aria-pressed", String(open));
    });
  }

  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { cy.style(style()); });

  // The picture the page opens with: nothing extra shown, the biggest folders open, fitted from the top.
  function start(then) {
    Object.keys(show).forEach(function (k) { show[k] = false; });
    expanded = {};
    autoExpand(28);
    clearFocus();
    search.value = "";
    syncClear();
    results.hidden = true;
    closeOptions();
    syncOptions();
    layout(function () {
      cy.fit(undefined, 16);
      // A wide graph fits by its width: pin it to the top rather than float it mid-screen.
      cy.pan({ x: cy.pan().x, y: 16 - cy.elements().boundingBox().y1 * cy.zoom() });
      if (then) then();
    });
  }
  document.getElementById("reset").onclick = function () { start(); };

  var started = performance.now();
  start(function () {
    window.deslopExplorer.ready = true;
    window.deslopExplorer.firstLayoutMs = performance.now() - started;
  });
})();
</script>
</body>
</html>
